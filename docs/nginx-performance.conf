# ==========================================================
# Everest Caravans — nginx performance config
#
# For whoever administers the production server. These are the
# three server-side changes behind the Lighthouse score on the
# campaign pages (/warrior and /warrior/thank-you). The
# application-side work is already done in the codebase; none of
# it can take effect without the gzip block below.
#
# Measured on https://everestcaravans.com.au/warrior,
# Lighthouse 12 mobile, 2026-11-19:
#
#   Performance score   77
#   First Contentful Paint   3.7 s   (score 29/100)
#   Largest Contentful Paint 4.2 s   (score 44/100)
#   Total Blocking Time       80 ms  (score 99/100)
#   Cumulative Layout Shift      0   (score 100/100)
#
# The two paint metrics are where the points are going. Blocking
# time and layout shift are already effectively full marks, so
# nothing here targets them.
# ==========================================================


# ----------------------------------------------------------
# 1. COMPRESSION  — the single biggest win
# ----------------------------------------------------------
# Dynamic HTML is already gzipped. Static files are NOT:
#
#   $ curl -sI -H 'Accept-Encoding: gzip' \
#       https://everestcaravans.com.au/css/warrior-landing.css
#   HTTP/1.1 200 OK
#   Content-Type: text/css
#   Content-Length: 43485          <-- no Content-Encoding
#
# warrior-landing.css is render-blocking, so every one of those
# bytes sits directly in front of First Contentful Paint. On a
# throttled 4G profile it occupied the main thread's critical path
# from 566ms to 1024ms — 458ms for one stylesheet.
#
#   warrior-landing.css    44,987 -> 10,585 bytes   (77% smaller)
#   warrior-thank-you.css  15,646 ->  4,424 bytes   (72% smaller)
#   topo.svg                6,928 ->  2,823 bytes   (60% smaller)
#
# Expected effect: roughly 300ms off FCP, and the same again off
# LCP, because the hero image cannot start downloading until the
# stylesheet that references it has been parsed.

gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   6;          # 6 is the usual sweet spot; 9 costs CPU for ~2% size
gzip_min_length   256;        # below this the gzip header costs more than it saves
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/ttf
    font/otf
    application/vnd.ms-fontobject;

# NOTE: do not add image/webp, image/jpeg, image/png or font/woff2
# to that list. They are already compressed formats — gzipping them
# burns CPU and usually makes the file marginally larger.

# Optional, better than gzip where the module is available
# (ngx_brotli). Roughly another 15-20% off text assets.
# brotli            on;
# brotli_comp_level 5;
# brotli_types      text/css application/javascript application/json image/svg+xml;


# ----------------------------------------------------------
# 2. HTTP/2
# ----------------------------------------------------------
# The site currently answers on HTTP/1.1:
#
#   $ curl -sI https://everestcaravans.com.au/warrior
#   HTTP/1.1 200 OK
#   Server: nginx
#
# HTTP/1.1 caps the browser at ~6 connections per origin and has no
# multiplexing, so requests queue. The campaign page pulls a lot of
# third-party script into an iframe, and that queueing competes with
# first-party assets.
#
# Add `http2` to the TLS listener — nginx 1.25.1+ prefers the
# separate directive shown second.

# listen 443 ssl http2;                 # nginx < 1.25.1
#
# listen 443 ssl;                       # nginx >= 1.25.1
# http2 on;


# ----------------------------------------------------------
# 3. STATIC ASSET CACHING
# ----------------------------------------------------------
# No Cache-Control is being sent on static files, so repeat visitors
# re-validate every asset on every page view. This does not change
# the Lighthouse first-load score — Lighthouse always tests cold —
# but it is most of the real-world experience for returning traffic.
#
# The application already appends ?v=<filemtime> to its CSS and
# image URLs, so the URL changes whenever the file does. That makes
# a long immutable max-age safe: a changed file is simply a new URL.

location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
    expires           1y;
    add_header        Cache-Control "public, immutable";
    access_log        off;
    try_files         $uri =404;
}


# ==========================================================
# AFTER APPLYING
# ==========================================================
#
#   nginx -t && systemctl reload nginx
#
# Then confirm compression is actually on the wire. The header
# must come back, and Content-Length must drop:
#
#   curl -sI -H 'Accept-Encoding: gzip' \
#     https://everestcaravans.com.au/css/warrior-landing.css \
#     | grep -i -E 'content-encoding|content-length'
#
# Expected:
#   content-encoding: gzip
#   content-length: ~10600
#
# If Cloudflare or another proxy sits in front of the origin, check
# there too — it may already compress on the edge, in which case the
# origin header above will still look uncompressed and the real
# browser response will not be. Test against the public hostname,
# not the origin IP.
# ==========================================================
